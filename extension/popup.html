<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px; background: #0d0d0f; color: #dfe9ef;
         font: 12px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font: 600 13px/1.2 ui-monospace, monospace; color: #7ee0ff; margin: 0 0 10px;
       letter-spacing: .04em; }
  label { display: block; margin: 8px 0 2px; color: #9fb3bd; font-size: 11px; }
  input, select { width: 100%; box-sizing: border-box; background: #16161c; color: #e8f2f7;
                  border: 1px solid #2b2b33; border-radius: 6px; padding: 5px 7px; font: inherit; }
  input[type=checkbox] { width: auto; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { margin: 0; }
  button { flex: 1; background: #16161c; color: #cfe9f5; border: 1px solid #2b2b33;
           border-radius: 6px; padding: 6px; font: 600 11px ui-sans-serif; cursor: pointer; }
  button:hover { border-color: #7ee0ff; color: #fff; }
  #status { margin-top: 10px; font: 11px ui-monospace, monospace; color: #7ee0ff;
            min-height: 2.4em; white-space: pre-wrap; }
  .note { margin-top: 8px; color: #6d7f89; font-size: 10.5px; }
  code { color: #7ee0ff; }
</style>
</head>
<body>
<h1>⛩ MANGATRANS</h1>

<label for="endpoint">Serveur local PocketPal</label>
<input id="endpoint" placeholder="http://127.0.0.1:8080">

<label for="apiKey">Cle API du serveur local (obligatoire)</label>
<input id="apiKey" type="password" placeholder="sans cle, tout fetch avec Origin = 403">

<label for="model">Modele charge</label>
<select id="model"><option>MiniCPM-V</option></select>

<div class="row">
  <label style="flex:1" for="sourceLang">Source
    <select id="sourceLang">
      <option>japonais</option><option>coreen</option><option>chinois</option>
      <option>anglais</option><option>espagnol</option>
    </select>
  </label>
  <label style="flex:1" for="targetLang">Cible
    <select id="targetLang">
      <option>francais</option><option>anglais</option><option>espagnol</option>
      <option>allemand</option><option>italien</option>
    </select>
  </label>
</div>

<label for="font">Police</label>
<select id="font">
  <option>Comic Neue</option><option>Bangers</option><option>ui-rounded</option>
  <option>Hiragino Maru Gothic ProN</option><option>serif</option>
</select>

<label for="warp">Forme du texte</label>
<select id="warp">
  <option value="none">droite</option><option value="arch" selected>arche</option>
  <option value="wave">vague</option><option value="bulge">renflement</option>
  <option value="perspective">perspective</option>
</select>

<div class="row">
  <input type="checkbox" id="vision">
  <label for="vision">Mode vision (VLM dans PocketPal) — decoche = OCR local tesseract.js, recommande</label>
</div>
<div class="row">
  <input type="checkbox" id="auto">
  <label for="auto">Traduire automatiquement au scroll</label>
</div>

<div class="row">
  <button id="probe">Tester</button>
  <button id="save">Enregistrer</button>
</div>

<div id="status"></div>

<p class="note">Le serveur local de PocketPal n'envoie aucun en-tete CORS : les
appels partent donc du <em>service worker</em>, jamais de la page. Laisse
PocketPal ouvert avec le serveur actif.</p>

</body>
</html>
